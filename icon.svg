<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud / Vault Gradients -->
    <linearGradient id="cloudGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#glowGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Background Decorative Geometric Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="256" cy="245" r="160" fill="none" stroke-dasharray="4 8"/>
    <circle cx="256" cy="245" r="195" fill="none" stroke-opacity="0.5"/>
  </g>

  <!-- Central Illustration: Cloud + Secure Drop Vault -->
  <g filter="url(#dropShadow)">
    <!-- Cloud Silhouette -->
    <path d="M 180 320 
             L 332 320 
             A 64 64 0 0 0 380 220 
             A 72 72 0 0 0 268 152 
             A 84 84 0 0 0 156 215 
             A 64 64 0 0 0 180 320 Z" 
          fill="url(#cloudGrad)"/>
          
    <!-- Cloud Highlight Rim -->
    <path d="M 180 320 
             L 332 320 
             A 64 64 0 0 0 380 220 
             A 72 72 0 0 0 268 152 
             A 84 84 0 0 0 156 215 
             A 64 64 0 0 0 180 320 Z" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
  </g>

  <!-- Central Vault / Shield Cutout with Arrow & Lock -->
  <!-- Shield Badge -->
  <g filter="url(#dropShadow)">
    <path d="M 256 200 
             L 302 222 
             V 268 
             C 302 302 256 324 256 324 
             C 256 324 210 302 210 268 
             V 222 
             Z" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Downward Transfer Arrow (Mail Drop) -->
    <path d="M 256 168 
             L 256 248" 
          stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 238 232 
             L 256 250 
             L 274 232" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Padlock inside shield -->
    <!-- Shackle -->
    <path d="M 246 270 
             V 263 
             A 10 10 0 0 1 266 263 
             V 270" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="241" y="270" width="30" height="22" rx="4" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Keyhole -->
    <circle cx="256" cy="279" r="2.5" fill="#ffffff"/>
    <path d="M 256 281.5 L 256 286" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- PIN Code Access Dots at Bottom -->
  <g transform="translate(176, 385)">
    <!-- Background Pill -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- 6 PIN Dots (Security & Password Indicator) -->
    <circle cx="30" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="54" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="78" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="102" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="126" cy="17" r="5" fill="#38bdf8"/>
    <circle cx="138" cy="17" r="2" fill="#38bdf8" opacity="0.3"/>
    <circle cx="22" cy="17" r="2" fill="#38bdf8" opacity="0.3"/>
  </g>
</svg>
